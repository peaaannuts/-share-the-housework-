name: Deploy housework-app

on:
  push:
    branches: [main]
    paths:
      - 'housework-app/**'
      - '.github/workflows/deploy-housework-app.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: housework-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: housework-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Write production env
        run: npm run ci:env
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.HOUSEWORK_FIREBASE_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.HOUSEWORK_FIREBASE_TOKEN }}

      - name: Build
        run: npm run build

      - name: Deploy
        run: npm run ci:deploy
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.HOUSEWORK_FIREBASE_PROJECT_ID }}
          FIREBASE_TOKEN: ${{ secrets.HOUSEWORK_FIREBASE_TOKEN }}
